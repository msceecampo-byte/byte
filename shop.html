<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Fairway Society</title>
  <meta name="description" content="Shop the Fairway Society First Tee Collection: refined knit polos, pleated skorts, UPF 50+ layers and accessories. Designed in Singapore.">
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="shop">
  <header id="site-header"></header>

  <main class="wrap" id="shop">
    <section class="shop-head">
      <p class="eyebrow">Drop 01 · Women</p>
      <h1>The First Tee Collection</h1>
      <p>Heritage clubhouse style, refined for the tropics: knit polos, pleated skorts and sun-ready layers in blush, claret, sage and cream.</p>
    </section>
    <div class="toolbar">
      <div id="chips"></div>
      <div class="toolbar-right">
        <span id="count" class="muted"></span>
        <label class="sr-only" for="sort">Sort</label>
        <select id="sort">
          <option value="featured">Featured</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
        </select>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="section"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/garments.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
